name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyyaml pandas networkx xlsx2csv snakemake==7.32.4

      - name: Check Python script syntax
        run: |
          python -m py_compile workflow/scripts/*.py
          flake8 workflow/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit test suite
        run: |
          pytest tests/ -v

      - name: Verify Snakemake workflow DAG (Dry-run)
        run: |
          snakemake -n -s workflow/Snakefile --directory workflow all
